<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>MiniDisplay Screen</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <!-- Place favicon.ico in the root directory -->

        <script>
         window.onload = function() {
             poll()
         };
         async function poll() {
             try {
                 const res = await fetch('https://status.ramzi.uk/status');
                 const data = await res.json();
                 render(data.status);
             } catch (e) {
                 // Try again
                 console.log(e)
             } finally {
                 setTimeout(poll, 2000);
             }
         }
         let currentStatus = null;
         function render(status) {
             // Skip identical re-renders so we don't restart media on every poll
             if (status === currentStatus) return;
             const container = document.getElementById("container");
             const tmpl = document.getElementById(status) || document.getElementById("unknown");
             container.replaceChildren(tmpl.content.cloneNode(true));
             currentStatus = status;
             // autoplay can still be refused; nudge it and surface the reason
             container.querySelectorAll("video").forEach(v => {
                 v.play().catch(e => console.log("video blocked:", e.name, e.message));
             });
         }
        </script>
    </head>
    <body>
        <!--[if lt IE 8]>
            <p class="browserupgrade">
            You are using an <strong>outdated</strong> browser. Please
            <a href="http://browsehappy.com/">upgrade your browser</a> to improve
            your experience.
            </p>
        <![endif]-->
        <template id="out">
            <div class="container-body status-out">
                <p class="headline">Out</p>
                <p class="sub">Back later</p>
            </div>
        </template>

        <template id="in-office">
            <div class="container-body status-in">
                <p class="headline">In the office</p>
                <p class="sub">Come on in</p>
            </div>
        </template>

        <template id="dnd">
            <div class="container-body status-dnd">
                <img class="icon" src="images/no-entry.svg" alt="">
                <p class="headline">Do not disturb</p>
            </div>
        </template>

        <template id="distracted">
            <div class="container-body status-distracted">
                <video autoplay loop muted playsinline>
                    <source src="images/pikachu-chair.mp4" type="video/mp4">
                </video>
            </div>
        </template>

        <template id="unknown">
            <div class="container-body status-unknown">
                <p class="headline">Unknown</p>
                <p class="sub">Status not recognised</p>
            </div>
        </template>

        <div id="wrapper">
            <div id="container">
                <div class="container-body status-unknown">
                    <p class="headline">Connecting</p>
                    <p class="sub">Waiting for status</p>
                </div>
            </div>
        </div>
        <style>
         html, body {
             height: 100%;
             margin: 0;
             /* Kiosk display: nothing should ever scroll off-screen */
             overflow: hidden;
             background-color: #000000;
             color: #ffffff;
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             /* Kiosk: no stray text selection or mouse pointer on the display */
             user-select: none;
             cursor: none;
         }

         #wrapper {
             display: flex;
             flex-direction: column;
             width: 100%;
             height: 100%;
         }

         /* Grow to fill #wrapper, and pass a definite height on to the body */
         #container {
             flex: 1;
             min-height: 0;
             display: flex;
             flex-direction: column;
         }

         .container-body {
             flex: 1;
             min-height: 0;
             display: flex;
             flex-direction: column;
             align-items: center;
             justify-content: center;
             gap: 0.25em;
             padding: 0.4em;
             box-sizing: border-box;
             text-align: center;
             background-color: #1a1a1a;
             color: #ffffff;
             /* The single scale knob. Every child is sized in em, so the whole
                layout tracks the smaller viewport dimension on any display. */
             font-size: 11vmin;
         }

         .headline {
             margin: 0;
             font-size: 1em;
             font-weight: 800;
             line-height: 1.05;
             letter-spacing: -0.02em;
             text-wrap: balance;
         }

         .sub {
             margin: 0;
             font-size: 0.28em;
             font-weight: 500;
             letter-spacing: 0.1em;
             text-transform: uppercase;
             opacity: 0.7;
         }

         /* Box the icon in both axes so a tall or wide screen can't overflow it */
         .icon {
             width: 3em;
             height: 3em;
             max-height: 45%;
             object-fit: contain;
         }

         .status-in      { background-color: #0d7a3d; }
         .status-out     { background-color: #9a5b00; }
         /* Near-black so the red of the no-entry sign carries the signal */
         .status-dnd     { background-color: #141414; }
         .status-unknown { background-color: #262626; color: #a0a0a0; }

         .status-distracted {
             background-color: #ededed;
             padding: 0;
         }

         video {
             /* Fill the box in both directions, then letterbox inside it so
                the frame scales up as well as down and is never cropped. */
             width: 100%;
             height: 100%;
             object-fit: contain;
             min-width: 0;
             min-height: 0;
         }
        </style>
    </body>
</html>
